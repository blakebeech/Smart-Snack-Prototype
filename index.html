<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Smart Snack</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app-wrapper">

    <!-- Left: Phone frame -->
    <div class="phone-frame">

      <!-- Header -->
      <header class="app-header">
        <span class="header-title">Smart Snack</span>
        <button class="header-star" aria-label="Favorites">&#9733;</button>
      </header>

      <!-- Search & filter row -->
      <div class="search-row">
        <span class="search-icon" aria-hidden="true">&#128269;</span>
        <input
          type="search"
          id="searchInput"
          class="search-input"
          placeholder="Search…"
          aria-label="Search recipes"
        />
        <button class="menu-toggle" id="menuToggle" aria-label="Open categories" aria-expanded="false">&#9776;</button>
      </div>

      <div class="filter-row" aria-label="Sort controls">
        <div class="filter-buttons">
          <button class="filter-btn" data-sort="time">Time</button>
          <button class="filter-btn" data-sort="calories">Calories</button>
          <button class="filter-btn" data-sort="cost">Cost</button>
        </div>
      </div>

      <div class="add-row" aria-label="Add new items">
        <button class="add-btn" id="addRecipeBtn" type="button">+ Add Recipe</button>
        <button class="add-btn" id="addSnackBtn" type="button">+ Add Snack</button>
      </div>

      <aside class="side-panel" aria-label="Category tabs">
        <nav class="tab-nav">
          <button class="tab-btn active" data-tab="recipes">Recipes&hellip;</button>
          <button class="tab-btn"        data-tab="snacks">Snacks&hellip;</button>
          <button class="tab-btn"        data-tab="other">Other&hellip;</button>
        </nav>
      </aside>

      <!-- Item list -->
      <main class="item-list" id="itemList" aria-live="polite">
        <!-- Cards injected by app.js -->
      </main>

    </div><!-- /phone-frame -->

  </div><!-- /app-wrapper -->

  <script src="app.js"></script>
</body>
</html>
