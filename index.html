<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Smart Snack</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app-wrapper">

    <!-- Left: Phone frame -->
    <div class="phone-frame">

      <!-- Header -->
      <header class="app-header">
        <span class="header-title">Smart Snack</span>
        <button class="header-star" id="headerStar" aria-label="Favorites">&#9733;</button>
      </header>

      <!-- Search & filter row -->
      <div class="search-row">
        <span class="search-icon" aria-hidden="true">&#128269;</span>
        <input
          type="search"
          id="searchInput"
          class="search-input"
          placeholder="Search…"
          aria-label="Search recipes"
        />
        <div class="filter-buttons">
          <button class="filter-btn" data-sort="time"     id="sortTime">Time</button>
          <button class="filter-btn" data-sort="calories" id="sortCalories">Calories</button>
          <button class="filter-btn" data-sort="cost"     id="sortCost">Cost</button>
        </div>
      </div>

      <!-- Item list -->
      <main class="item-list" id="itemList" aria-live="polite">
        <!-- Cards injected by app.js -->
      </main>

    </div><!-- /phone-frame -->

    <!-- Right: navigation panel -->
    <aside class="side-panel">
      <nav class="tab-nav" aria-label="Category tabs">
        <button class="tab-btn active" data-tab="recipes">Recipes&hellip;</button>
        <button class="tab-btn"        data-tab="snacks">Snacks&hellip;</button>
        <button class="tab-btn"        data-tab="other">Other&hellip;</button>
      </nav>
      <div class="user-pill" aria-label="Logged in user">Daniel Bamidele</div>
    </aside>

  </div><!-- /app-wrapper -->

  <script src="app.js"></script>
</body>
</html>
